name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Linter (Ruff)
      run: |
        ruff check .
        ruff format --check .

    - name: Run Tests
      run: |
        pytest tests/ -v

  build-docker:
    runs-on: ubuntu-latest
    needs: test-and-lint # Запускается только если тесты и линтер прошли успешно
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t marketplace-app:latest .
        echo "Docker image built successfully!"