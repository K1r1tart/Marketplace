<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Современный маркетплейс</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .product-card {
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .category-card {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .category-card:hover {
            transform: scale(1.05);
        }
        .category-card.active {
            ring: 2px;
            ring-color: #9333ea;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Шапка -->
    <header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4 py-3">
        <div class="flex items-center justify-between">
            <!-- Логотип (кликабельный!) -->
            <a href="#" onclick="goHome(); return false;" class="flex items-center space-x-2 cursor-pointer">
                <i class="fas fa-store text-3xl text-purple-600"></i>
                <span class="text-2xl font-bold text-gray-800">Marketplace</span>
            </a>

            <!-- Поиск -->
            <div class="flex-1 max-w-2xl mx-8">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Искать товары..."
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-purple-500">
                    <button class="absolute right-3 top-2 text-gray-400 hover:text-purple-600">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <!-- Навигация + профиль -->
            <div class="flex items-center space-x-6">
                <nav id="nav-links" class="hidden flex items-center space-x-4">
                    <button onclick="goHome()" class="text-gray-700 hover:text-purple-600 font-medium">Главная</button>
                    <button onclick="showCatalog()" class="text-gray-700 hover:text-purple-600 font-medium">Каталог</button>
                    <button onclick="showOrders()" class="text-gray-700 hover:text-purple-600 font-medium">Мои заказы</button>
                </nav>
                <div id="nav-auth" class="flex items-center space-x-4">
                    <button onclick="showAuthModal()" class="btn-primary text-white px-6 py-2 rounded-lg hover:opacity-90 transition">
                        <i class="fas fa-user mr-2"></i>Войти
                    </button>
                </div>
                <div id="nav-user" class="hidden flex items-center space-x-4">
                    <button onclick="showCart()" class="relative text-gray-700 hover:text-purple-600">
                        <i class="fas fa-shopping-cart text-2xl"></i>
                        <span id="cart-count" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
                    </button>
                    <div class="flex items-center space-x-2">
                        <span id="user-email" class="text-gray-700"></span>
                        <span id="user-role" class="bg-purple-100 text-purple-800 px-3 py-1 rounded-full text-sm font-medium"></span>
                    </div>
                    <button onclick="logout()" class="text-red-500 hover:text-red-700">
                        <i class="fas fa-sign-out-alt text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>

    <!-- Категории -->
    <section class="container mx-auto px-4 py-8">
        <h2 class="text-3xl font-bold mb-6">Популярные категории</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div class="category-card bg-white rounded-lg p-6 text-center shadow" onclick="filterByCategory('all')">
                <i class="fas fa-th text-4xl text-gray-500 mb-2"></i>
                <p class="font-medium">Все</p>
            </div>
            <div class="category-card bg-white rounded-lg p-6 text-center shadow" onclick="filterByCategory('electronics')">
                <i class="fas fa-laptop text-4xl text-blue-500 mb-2"></i>
                <p class="font-medium">Электроника</p>
            </div>
            <div class="category-card bg-white rounded-lg p-6 text-center shadow" onclick="filterByCategory('clothing')">
                <i class="fas fa-tshirt text-4xl text-pink-500 mb-2"></i>
                <p class="font-medium">Одежда</p>
            </div>
            <div class="category-card bg-white rounded-lg p-6 text-center shadow" onclick="filterByCategory('home')">
                <i class="fas fa-home text-4xl text-green-500 mb-2"></i>
                <p class="font-medium">Дом</p>
            </div>
            <div class="category-card bg-white rounded-lg p-6 text-center shadow" onclick="filterByCategory('books')">
                <i class="fas fa-book text-4xl text-yellow-500 mb-2"></i>
                <p class="font-medium">Книги</p>
            </div>
            <div class="category-card bg-white rounded-lg p-6 text-center shadow" onclick="filterByCategory('sport')">
                <i class="fas fa-futbol text-4xl text-orange-500 mb-2"></i>
                <p class="font-medium">Спорт</p>
            </div>
        </div>
    </section>

    <!-- Основной контент -->
    <main class="container mx-auto px-4 py-8">
        <div id="welcome-section" class="text-center py-20">
            <h1 class="text-5xl font-bold text-gray-800 mb-4">Добро пожаловать в Marketplace</h1>
            <p class="text-xl text-gray-600 mb-8">Тысячи товаров по лучшим ценам</p>
            <button onclick="showAuthModal()" class="btn-primary text-white px-8 py-3 rounded-lg text-lg hover:opacity-90 transition">
                Начать покупки
            </button>
        </div>

        <div id="catalog-section" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-bold">Каталог товаров</h2>
                <button id="add-product-btn" onclick="showAddProductModal()" class="hidden btn-primary text-white px-6 py-2 rounded-lg">
                    <i class="fas fa-plus mr-2"></i>Добавить товар
                </button>
            </div>
            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
        </div>

        <div id="cart-section" class="hidden">
            <h2 class="text-3xl font-bold mb-6">Мои заказы</h2>
            <div id="orders-list" class="space-y-4">
            </div>
            <h2 class="text-3xl font-bold mb-6">Корзина</h2>
            <div id="cart-items" class="space-y-4">
            </div>
            <div class="mt-8 bg-white rounded-lg p-6 shadow">
                <div class="flex justify-between items-center">
                    <span class="text-xl font-bold">Итого:</span>
                    <span id="cart-total" class="text-2xl font-bold text-purple-600">0 ₽</span>
                </div>
                <button onclick="checkout()" class="w-full btn-primary text-white py-3 rounded-lg mt-4 text-lg">
                    Оформить заказ
                </button>
            </div>
        </div>
    </main>

    <!-- Модальное окно авторизации -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-md w-full">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="text-2xl font-bold">Вход</h2>
                <button onclick="closeModal('auth-modal')" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Пароль</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                </div>
                <div id="role-field" class="mb-4 hidden">
                    <label class="block text-gray-700 mb-2">Роль</label>
                    <select id="role" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                        <option value="buyer">Покупатель</option>
                        <option value="seller">Продавец</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>
                <button type="submit" class="w-full btn-primary text-white py-2 rounded-lg">
                    <span id="submit-btn-text">Войти</span>
                </button>
            </form>
            <div class="mt-4 text-center">
                <button id="toggle-auth" onclick="toggleAuthMode()" class="text-purple-600 hover:underline">
                    Нет аккаунта? Зарегистрироваться
                </button>
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления товара -->
    <div id="add-product-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-md w-full">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Добавить товар</h2>
                <button onclick="closeModal('add-product-modal')" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form onsubmit="handleAddProduct(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Название</label>
                    <input type="text" id="product-title" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Описание</label>
                    <textarea id="product-description" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500"></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Категория</label>
                    <select id="product-category" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                        <option value="electronics">Электроника</option>
                        <option value="clothing">Одежда</option>
                        <option value="home">Дом</option>
                        <option value="books">Книги</option>
                        <option value="sport">Спорт</option>
                        <option value="other">Другое</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Цена</label>
                    <input type="number" id="product-price" required min="0" step="0.01" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Остаток</label>
                    <input type="number" id="product-stock" required min="0" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-purple-500">
                </div>
                <button type="submit" class="w-full btn-primary text-white py-2 rounded-lg">
                    Добавить
                </button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
