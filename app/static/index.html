<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Навигация -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <i class="fas fa-store text-blue-600 text-2xl mr-2"></i>
                    <span class="font-bold text-xl text-gray-800">Marketplace</span>
                </div>
                <div id="nav-auth" class="flex items-center space-x-4">
                    <button onclick="showLoginModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
                        Войти
                    </button>
                </div>
                <div id="nav-user" class="hidden flex items-center space-x-4">
                    <span id="user-email" class="text-gray-700"></span>
                    <span id="user-role" class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm"></span>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Главный контент -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="welcome-section" class="text-center py-20">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">Добро пожаловать в Marketplace</h1>
            <p class="text-xl text-gray-600 mb-8">Торговая площадка с умными рекомендациями</p>
            <button onclick="showLoginModal()" class="bg-blue-600 text-white px-8 py-3 rounded-lg text-lg hover:bg-blue-700">
                Начать покупки
            </button>
        </div>

        <div id="catalog-section" class="hidden">
            <h2 class="text-2xl font-bold mb-6">Каталог товаров</h2>
            <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
                <!-- Товары будут добавлены через JS -->
            </div>
        </div>
    </main>

    <!-- Модальное окно входа/регистрации -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-md w-full">
            <div class="flex justify-between items-center mb-6">
                <h2 id="modal-title" class="text-2xl font-bold">Вход</h2>
                <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 mb-2">Пароль</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <div id="role-field" class="mb-4 hidden">
                    <label class="block text-gray-700 mb-2">Роль</label>
                    <select id="role" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:border-blue-500">
                        <option value="buyer">Покупатель</option>
                        <option value="seller">Продавец</option>
                        <option value="admin">Администратор</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                    <span id="submit-btn-text">Войти</span>
                </button>
            </form>

            <div class="mt-4 text-center">
                <button id="toggle-auth" onclick="toggleAuthMode()" class="text-blue-600 hover:underline">
                    Нет аккаунта? Зарегистрироваться
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
